[workspace]
name = "panda-coal"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.12.*"
coal = "3.*"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
pip = "*"

[pypi-dependencies]
mujoco = "==3.3.7"
imageio = ">=2.34,<3"
imageio-ffmpeg = "==0.6.0"
pillow = ">=10"
requests = ">=2.31,<3"
